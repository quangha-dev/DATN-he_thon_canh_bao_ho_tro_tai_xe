[project]
name = "safefleet-ai"
version = "0.2.0"
description = "Production AI boundary for SafeFleet OCR, intent and data agent"
requires-python = ">=3.11,<3.13"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
