name: safefleet

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+07:00
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [safefleet]

  backend:
    build:
      context: ./web_quan_ly/backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-1440}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-30}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SEED_ENABLED: ${SEED_ENABLED:-false}
      HANOI_DEMO_DATA_ENABLED: ${HANOI_DEMO_DATA_ENABLED:-false}
      PHOTON_URL: ${PHOTON_URL}
      OSRM_URL: ${OSRM_URL}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      EVIDENCE_STORAGE_PROVIDER: ${EVIDENCE_STORAGE_PROVIDER:-minio}
      EVIDENCE_STORAGE_PATH: /data/evidence
      EVIDENCE_MAX_SIZE_BYTES: ${EVIDENCE_MAX_SIZE_BYTES:-8388608}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      SAFETY_EVENT_COOLDOWN_SECONDS: ${SAFETY_EVENT_COOLDOWN_SECONDS:-30}
      SOS_COOLDOWN_SECONDS: ${SOS_COOLDOWN_SECONDS:-30}
      FCM_ENABLED: ${FCM_ENABLED:-false}
      PUSH_DISPATCH_INTERVAL_MS: ${PUSH_DISPATCH_INTERVAL_MS:-30000}
      AI_SERVICE_ENABLED: ${AI_SERVICE_ENABLED:-true}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8000}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - evidence_data:/data/evidence
    depends_on:
      mysql:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [safefleet]

  frontend:
    build:
      context: ./web_quan_ly/frontend
      args:
        BACKEND_INTERNAL_URL: http://backend:8080
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8080
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks: [safefleet]

  ai-service:
    build:
      context: ./safefleet_ai
    restart: unless-stopped
    environment:
      OPENAI_ENABLED: ${OPENAI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-8}
      MODEL_DIR: /models
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    volumes:
      - ai_models:/models
      - ./safefleet_ai/models/safefleet_temporal_rules.json:/models/safefleet_temporal_rules.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [safefleet]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [safefleet]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    volumes:
      - ./docker/minio/init-bucket.sh:/opt/safefleet/init-bucket.sh:ro
    entrypoint: ["/bin/sh", "/opt/safefleet/init-bucket.sh"]
    networks: [safefleet]

volumes:
  mysql_data:
  minio_data:
  ai_models:
  evidence_data:

networks:
  safefleet:
    driver: bridge
