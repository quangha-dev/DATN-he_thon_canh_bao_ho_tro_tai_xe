name: safefleet

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [safefleet]

  backend:
    build:
      context: ./web_quan_ly/backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-1440}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-30}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SEED_ENABLED: ${SEED_ENABLED:-false}
      HANOI_DEMO_DATA_ENABLED: ${HANOI_DEMO_DATA_ENABLED:-false}
      PHOTON_URL: ${PHOTON_URL}
      OSRM_URL: ${OSRM_URL}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      EVIDENCE_STORAGE_PROVIDER: ${EVIDENCE_STORAGE_PROVIDER:-minio}
      EVIDENCE_STORAGE_PATH: /data/evidence
      EVIDENCE_MAX_SIZE_BYTES: ${EVIDENCE_MAX_SIZE_BYTES:-8388608}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      SAFETY_EVENT_COOLDOWN_SECONDS: ${SAFETY_EVENT_COOLDOWN_SECONDS:-30}
      SOS_COOLDOWN_SECONDS: ${SOS_COOLDOWN_SECONDS:-30}
      FCM_ENABLED: ${FCM_ENABLED:-false}
      PUSH_DISPATCH_INTERVAL_MS: ${PUSH_DISPATCH_INTERVAL_MS:-30000}
      AI_SERVICE_ENABLED: ${AI_SERVICE_ENABLED:-true}
      OCR_SERVER_ENABLED: ${OCR_SERVER_ENABLED:-true}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8000}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-${JWT_SECRET}}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - evidence_data:/data/evidence
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [safefleet]

  frontend:
    build:
      context: ./web_quan_ly/frontend
      args:
        BACKEND_INTERNAL_URL: http://backend:8080
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8080
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks: [safefleet]

  ai-service:
    build:
      context: .
      dockerfile: safefleet_ai/Dockerfile
    restart: unless-stopped
    environment:
      AGENT_ENCRYPTION_SECRET: ${AGENT_ENCRYPTION_SECRET:-${JWT_SECRET}}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-${JWT_SECRET}}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_ENABLED: ${OPENAI_ENABLED:-false}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-6}
      BACKEND_INTERNAL_URL: http://backend:8080
      AI_CONFIG_PATH: /data/agent_config.json
      MODEL_DIR: /models
      OCR_MODEL_DIR: /app/ocr_models
      TESSERACT_CMD: /usr/bin/tesseract
      OCR_MAX_UPLOAD_BYTES: ${OCR_MAX_UPLOAD_BYTES:-10485760}
      TZ: Asia/Ho_Chi_Minh
    expose:
      - "8000"
    volumes:
      - ai_models:/models
      - ai_data:/data
      - ./safefleet_ai/models/safefleet_temporal_rules.json:/models/safefleet_temporal_rules.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [safefleet]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [safefleet]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    volumes:
      - ./docker/minio/init-bucket.sh:/opt/safefleet/init-bucket.sh:ro
    entrypoint: ["/bin/sh", "/opt/safefleet/init-bucket.sh"]
    networks: [safefleet]

volumes:
  postgres_data:
  minio_data:
  ai_models:
  ai_data:
  evidence_data:

networks:
  safefleet:
    driver: bridge
