worker_processes auto;
worker_rlimit_nofile 8192;

error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept       on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Không lộ phiên bản nginx trong header và trang lỗi.
    server_tokens off;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;

    # Điện thoại tài xế chạy trên mạng di động hay rớt; giữ kết nối lâu hơn
    # mặc định để bớt bắt tay TLS lại.
    keepalive_timeout  75s;
    keepalive_requests 1000;

    # Bằng chứng ảnh và ảnh OCR đi qua backend. EVIDENCE_MAX_SIZE_BYTES là 8 MB
    # và OCR_MAX_UPLOAD_BYTES là 10 MB; 16 MB phủ cả phần bao multipart.
    client_max_body_size      16m;
    client_body_timeout       60s;
    client_header_timeout     20s;
    large_client_header_buffers 4 16k;

    # Log có thời gian xử lý để soi được request chậm khi vận hành.
    log_format safefleet escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent"'
        '}';
    access_log /var/log/nginx/access.log safefleet;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/manifest+json image/svg+xml
                      application/vnd.api+json;

    # Giới hạn theo IP. Đội xe nội bộ đi qua NAT nhà mạng nên hạn mức chung phải
    # rộng; riêng đăng nhập siết chặt để chặn dò mật khẩu.
    limit_req_zone  $binary_remote_addr zone=api_zone:16m   rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=login_zone:8m  rate=12r/m;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn_zone:16m;
    limit_conn_status 429;

    # Bật nâng cấp WebSocket cho /ws-native mà không phá HTTP thường.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    include /etc/nginx/conf.d/*.conf;
}
