services:
  postgres:
    ports: !reset []
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # The official PostgreSQL entrypoint starts as root so it can fix volume
    # ownership, then drops privileges to the postgres user.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]

  minio:
    ports: !reset []
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  minio-init:
    environment:
      MC_CONFIG_DIR: /tmp/.mc
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  ai-service:
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  backend:
    ports: !override
      - "${PRODUCTION_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  frontend:
    ports: !override
      - "${PRODUCTION_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
