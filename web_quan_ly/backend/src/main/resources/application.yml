server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: safefleet-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/safefleet}
    username: ${DB_USERNAME:safefleet}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173}
    allow-localhost-patterns: ${CORS_ALLOW_LOCALHOST_PATTERNS:false}
  seed:
    enabled: ${SEED_ENABLED:false}
    hanoi-demo-data-enabled: ${HANOI_DEMO_DATA_ENABLED:false}
  location:
    photon-url: ${PHOTON_URL:https://photon.komoot.io/api/}
    osrm-url: ${OSRM_URL:https://router.project-osrm.org/route/v1/driving}
  safety:
    cooldown-seconds: ${SAFETY_EVENT_COOLDOWN_SECONDS:30}
  sos:
    cooldown-seconds: ${SOS_COOLDOWN_SECONDS:30}
  evidence:
    provider: ${EVIDENCE_STORAGE_PROVIDER:local}
    storage-path: ${EVIDENCE_STORAGE_PATH:./data/evidence}
    max-size-bytes: ${EVIDENCE_MAX_SIZE_BYTES:8388608}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:}
      secret-key: ${MINIO_SECRET_KEY:}
      bucket: ${MINIO_BUCKET:safefleet-evidence}
  push:
    fcm-enabled: ${FCM_ENABLED:false}
    dispatch-interval-ms: ${PUSH_DISPATCH_INTERVAL_MS:30000}
  ai-service:
    enabled: ${AI_SERVICE_ENABLED:false}
    ocr-enabled: ${OCR_SERVER_ENABLED:true}
    url: ${AI_SERVICE_URL:http://localhost:8000}
    internal-token: ${AI_INTERNAL_TOKEN:}
    connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${AI_READ_TIMEOUT_MS:120000}
    ocr-max-upload-bytes: ${OCR_MAX_UPLOAD_BYTES:10485760}
    ocr-connect-timeout-ms: ${OCR_CONNECT_TIMEOUT_MS:5000}
    ocr-read-timeout-ms: ${OCR_READ_TIMEOUT_MS:120000}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
