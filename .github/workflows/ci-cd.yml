name: SafeFleet CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safefleet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test Spring Boot and PostgreSQL integration
        working-directory: web_quan_ly/backend
        run: mvn --batch-mode --no-transfer-progress test

  frontend-test:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web_quan_ly/frontend/package-lock.json
      - name: Install dependencies
        working-directory: web_quan_ly/frontend
        run: npm ci
      - name: Lint
        working-directory: web_quan_ly/frontend
        run: npm run lint
      - name: Production build
        working-directory: web_quan_ly/frontend
        run: npm run build

  ai-test:
    name: AI, MCP and RAG tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Build reproducible AI test image
        run: docker build --target test -t safefleet-ai-test:${{ github.sha }} -f safefleet_ai/Dockerfile .
      - name: Run pytest in image
        run: docker run --rm safefleet-ai-test:${{ github.sha }}

  mobile-test:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.5
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: safe_fleet_driver_ui
        run: flutter pub get
      - name: Verify bundled drowsiness model matches its metadata
        working-directory: safe_fleet_driver_ui/assets/models
        run: |
          declared="$(python3 -c "import json;print(json.load(open('drowsiness_model.json'))['runtime_sha256'].upper())")"
          actual="$(sha256sum drowsiness_model.tflite | cut -d' ' -f1 | tr 'a-z' 'A-Z')"
          echo "declared=$declared"
          echo "actual  =$actual"
          if [ "$declared" != "$actual" ]; then
            echo "::error::drowsiness_model.tflite khong khop runtime_sha256 trong metadata." \
                 "Phat hien ngu gat la tinh nang an toan; khong duoc build voi model khong xac dinh."
            exit 1
          fi
      - name: Analyze
        working-directory: safe_fleet_driver_ui
        run: flutter analyze
      - name: Test
        working-directory: safe_fleet_driver_ui
        run: flutter test
      - name: Compile Android debug APK
        working-directory: safe_fleet_driver_ui
        run: flutter build apk --debug --dart-define=API_BASE_URL=https://ci.invalid/api/v1

  mobile-release:
    name: Android release artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: mobile-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.5
          channel: stable
          cache: true
      # Khong co secret keystore thi bo qua buoc nay; Gradle se ky bang debug key.
      - name: Restore release keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SAFEEFLEET_ANDROID_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Install dependencies
        working-directory: safe_fleet_driver_ui
        run: flutter pub get
      # Khong co keystore thi Gradle ky bang debug key: cai duoc de pilot nhung
      # khong phat hanh Play Store duoc. Khong bao gio commit keystore vao repo.
      # Gradle nem loi neu thieu keystore, nen chi build khi da co secret.
      - name: Explain skipped release build
        if: env.SAFEEFLEET_ANDROID_STORE_FILE == ''
        run: >-
          echo "::notice::Bo qua ban phat hanh vi chua cau hinh secret
          ANDROID_KEYSTORE_BASE64. Xem deploy/vps/RUNBOOK.md muc 8."
      - name: Build release AAB and split APKs
        if: env.SAFEEFLEET_ANDROID_STORE_FILE != ''
        working-directory: safe_fleet_driver_ui
        env:
          SAFEEFLEET_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SAFEEFLEET_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SAFEEFLEET_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build appbundle --release \
            --dart-define=API_BASE_URL=https://${{ vars.APP_DOMAIN }}/api/v1
          flutter build apk --release --split-per-abi \
            --dart-define=API_BASE_URL=https://${{ vars.APP_DOMAIN }}/api/v1
      - name: Report artifact sizes
        if: env.SAFEEFLEET_ANDROID_STORE_FILE != ''
        working-directory: safe_fleet_driver_ui
        run: |
          echo '### Kich thuoc ban phat hanh' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          find build/app/outputs -name '*.aab' -o -name '*.apk' \
            | sort | while read -r f; do
                printf -- '- `%s` — %s\n' "$f" "$(du -h "$f" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
              done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: env.SAFEEFLEET_ANDROID_STORE_FILE != ''
        with:
          name: safefleet-driver-release
          retention-days: 14
          path: |
            safe_fleet_driver_ui/build/app/outputs/bundle/release/*.aab
            safe_fleet_driver_ui/build/app/outputs/flutter-apk/*.apk

  compose-validate:
    name: Validate production composition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Prepare non-secret validation environment
        run: cp deploy/vps/.env.production.example .env.validation
      - name: Validate merged Compose model
        run: >-
          IMAGE_TAG=${{ github.sha }}
          docker compose --env-file .env.validation
          -f docker-compose.yml
          -f docker-compose.production.yml
          -f docker-compose.routing.yml
          -f deploy/vps/docker-compose.vps.yml
          config --quiet
      - name: Validate deployment scripts
        run: >-
          bash -n deploy/vps/backup.sh deploy/vps/health-check.sh
          deploy/vps/deploy.sh deploy/vps/init-tls.sh
      # Sai mot dau ngoac trong nginx.conf lam ca he thong khong len duoc.
      # Bat loi o CI thay vi luc deploy: dung chinh image cua production, cap
      # chung chi tu ky de nginx -t chay duoc ma khong can Let's Encrypt.
      - name: Validate nginx edge configuration
        run: |
          set -euo pipefail
          domain=ci.invalid
          docker volume create safefleet-ci-tls >/dev/null
          docker run --rm -v safefleet-ci-tls:/etc/letsencrypt --entrypoint sh \
            certbot/certbot:latest -c "
              mkdir -p /etc/letsencrypt/live/$domain
              openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
                -keyout /etc/letsencrypt/live/$domain/privkey.pem \
                -out /etc/letsencrypt/live/$domain/fullchain.pem \
                -subj '/CN=$domain' 2>/dev/null
            "
          docker run --rm \
            --add-host backend:127.0.0.1 --add-host frontend:127.0.0.1 \
            -e APP_DOMAIN=$domain -e NGINX_ENVSUBST_FILTER='^APP_' \
            -v "$PWD/deploy/vps/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/deploy/vps/nginx/templates:/etc/nginx/templates:ro" \
            -v safefleet-ci-tls:/etc/letsencrypt:ro \
            nginx:1.29-alpine sh -c '/docker-entrypoint.sh nginx -t'
          docker volume rm safefleet-ci-tls >/dev/null

  publish-images:
    name: Publish ${{ matrix.image }} image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-test, frontend-test, ai-test, mobile-test, compose-validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: web_quan_ly/backend
            dockerfile: web_quan_ly/backend/Dockerfile
          - image: frontend
            context: web_quan_ly/frontend
            dockerfile: web_quan_ly/frontend/Dockerfile
          - image: ai
            context: .
            dockerfile: safefleet_ai/Dockerfile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Download external OCR model bundle
        if: matrix.image == 'ai'
        env:
          OCR_MODELS_ARCHIVE_URL: ${{ secrets.OCR_MODELS_ARCHIVE_URL }}
          OCR_MODELS_DOWNLOAD_TOKEN: ${{ secrets.OCR_MODELS_DOWNLOAD_TOKEN }}
          OCR_MODELS_ARCHIVE_SHA256: ${{ secrets.OCR_MODELS_ARCHIVE_SHA256 }}
        run: |
          test -n "$OCR_MODELS_ARCHIVE_URL"
          test -n "$OCR_MODELS_ARCHIVE_SHA256"
          mkdir -p safefleet_ai/models/ocr
          curl --fail --location --retry 3 \
            --header "Authorization: Bearer $OCR_MODELS_DOWNLOAD_TOKEN" \
            "$OCR_MODELS_ARCHIVE_URL" \
            --output /tmp/safefleet-ocr-models.tar.gz
          printf '%s  %s\n' "$OCR_MODELS_ARCHIVE_SHA256" /tmp/safefleet-ocr-models.tar.gz | sha256sum --check --strict
          tar -xzf /tmp/safefleet-ocr-models.tar.gz -C safefleet_ai/models/ocr
          test -f safefleet_ai/models/ocr/vietocr/vgg_transformer.pth
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: runtime
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/safefleet/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/safefleet/${{ matrix.image }}:main
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy-production:
    name: Deploy production VPS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish-images
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.APP_DOMAIN }}
    concurrency:
      group: safefleet-production
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Configure pinned SSH host identity
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Synchronize immutable deployment definitions
        run: |
          ssh "$VPS_USER@$VPS_HOST" 'mkdir -p /opt/safefleet/app'
          rsync -az --relative \
            docker-compose.yml \
            docker-compose.production.yml \
            docker-compose.routing.yml \
            docker/minio/init-bucket.sh \
            safefleet_ai/models/safefleet_temporal_rules.json \
            deploy/vps/ \
            "$VPS_USER@$VPS_HOST:/opt/safefleet/app/"
      - name: Authenticate VPS to GHCR
        run: >-
          printf '%s' "$GHCR_READ_TOKEN" |
          ssh "$VPS_USER@$VPS_HOST"
          "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"
      - name: Backup, deploy, verify and record release
        run: >-
          ssh "$VPS_USER@$VPS_HOST"
          "bash /opt/safefleet/app/deploy/vps/deploy.sh '${{ github.sha }}'"
