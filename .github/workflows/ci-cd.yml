name: SafeFleet CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safefleet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test Spring Boot and PostgreSQL integration
        working-directory: web_quan_ly/backend
        run: mvn --batch-mode --no-transfer-progress test

  frontend-test:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web_quan_ly/frontend/package-lock.json
      - name: Install dependencies
        working-directory: web_quan_ly/frontend
        run: npm ci
      - name: Lint
        working-directory: web_quan_ly/frontend
        run: npm run lint
      - name: Production build
        working-directory: web_quan_ly/frontend
        run: npm run build

  ai-test:
    name: AI, MCP and RAG tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Build reproducible AI test image
        run: docker build --target test -t safefleet-ai-test:${{ github.sha }} -f safefleet_ai/Dockerfile .
      - name: Run pytest in image
        run: docker run --rm safefleet-ai-test:${{ github.sha }}

  mobile-test:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.5
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: safe_fleet_driver_ui
        run: flutter pub get
      - name: Analyze
        working-directory: safe_fleet_driver_ui
        run: flutter analyze
      - name: Test
        working-directory: safe_fleet_driver_ui
        run: flutter test
      - name: Compile Android debug APK
        working-directory: safe_fleet_driver_ui
        run: flutter build apk --debug --dart-define=API_BASE_URL=https://ci.invalid/api/v1

  compose-validate:
    name: Validate production composition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Prepare non-secret validation environment
        run: cp deploy/vps/.env.production.example .env.validation
      - name: Validate merged Compose model
        run: >-
          IMAGE_TAG=${{ github.sha }}
          docker compose --env-file .env.validation
          -f docker-compose.yml
          -f docker-compose.production.yml
          -f docker-compose.routing.yml
          -f deploy/vps/docker-compose.vps.yml
          config --quiet
      - name: Validate deployment scripts
        run: bash -n deploy/vps/backup.sh deploy/vps/health-check.sh deploy/vps/deploy.sh

  publish-images:
    name: Publish ${{ matrix.image }} image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-test, frontend-test, ai-test, mobile-test, compose-validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: web_quan_ly/backend
            dockerfile: web_quan_ly/backend/Dockerfile
          - image: frontend
            context: web_quan_ly/frontend
            dockerfile: web_quan_ly/frontend/Dockerfile
          - image: ai
            context: .
            dockerfile: safefleet_ai/Dockerfile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Download external OCR model bundle
        if: matrix.image == 'ai'
        env:
          OCR_MODELS_ARCHIVE_URL: ${{ secrets.OCR_MODELS_ARCHIVE_URL }}
          OCR_MODELS_DOWNLOAD_TOKEN: ${{ secrets.OCR_MODELS_DOWNLOAD_TOKEN }}
          OCR_MODELS_ARCHIVE_SHA256: ${{ secrets.OCR_MODELS_ARCHIVE_SHA256 }}
        run: |
          test -n "$OCR_MODELS_ARCHIVE_URL"
          test -n "$OCR_MODELS_ARCHIVE_SHA256"
          mkdir -p safefleet_ai/models/ocr
          curl --fail --location --retry 3 \
            --header "Authorization: Bearer $OCR_MODELS_DOWNLOAD_TOKEN" \
            "$OCR_MODELS_ARCHIVE_URL" \
            --output /tmp/safefleet-ocr-models.tar.gz
          printf '%s  %s\n' "$OCR_MODELS_ARCHIVE_SHA256" /tmp/safefleet-ocr-models.tar.gz | sha256sum --check --strict
          tar -xzf /tmp/safefleet-ocr-models.tar.gz -C safefleet_ai/models/ocr
          test -f safefleet_ai/models/ocr/vietocr/vgg_transformer.pth
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: runtime
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/safefleet/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/safefleet/${{ matrix.image }}:main
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy-production:
    name: Deploy production VPS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish-images
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.APP_DOMAIN }}
    concurrency:
      group: safefleet-production
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Configure pinned SSH host identity
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Synchronize immutable deployment definitions
        run: |
          ssh "$VPS_USER@$VPS_HOST" 'mkdir -p /opt/safefleet/app'
          rsync -az --relative \
            docker-compose.yml \
            docker-compose.production.yml \
            docker-compose.routing.yml \
            docker/minio/init-bucket.sh \
            safefleet_ai/models/safefleet_temporal_rules.json \
            deploy/vps/ \
            "$VPS_USER@$VPS_HOST:/opt/safefleet/app/"
      - name: Authenticate VPS to GHCR
        run: >-
          printf '%s' "$GHCR_READ_TOKEN" |
          ssh "$VPS_USER@$VPS_HOST"
          "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"
      - name: Backup, deploy, verify and record release
        run: >-
          ssh "$VPS_USER@$VPS_HOST"
          "bash /opt/safefleet/app/deploy/vps/deploy.sh '${{ github.sha }}'"
